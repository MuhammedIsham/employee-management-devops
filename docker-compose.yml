services:
  db:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: employee_password
      POSTGRES_DB: employees_db

    ports:
      - "5432:5432"

  app:
    build: .
    container_name: employee-app

    ports:
      - "5000:5000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://employee_user:employee_password@db:5432/employees_db
